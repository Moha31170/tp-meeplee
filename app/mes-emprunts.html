<!DOCTYPE html>
<html lang="fr">
<head>

  <title>Meeple — Mes emprunts</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>Meeple</h1>
    <nav aria-label="Navigation principale"></nav>
  </header>
  <main>
    <h2>Mes emprunts</h2>
    <p id="compteur"></p>
    <p id="message" role="status"></p>
    <table id="emprunts">
      <thead>
        <tr><th>Jeu</th><th>Emprunté le</th><th>Retour prévu</th><th>Statut</th><th>Pénalité</th><th>Actions</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <h3>Mes réservations</h3>
    <ul id="reservations"></ul>
    <p id="aucune-reservation" class="infos" hidden>Aucune réservation en attente.</p>
  </main>
  <footer></footer>
  <script type="module" src="/js/session.js"></script>
  <script type="module" src="/js/pages/mes-emprunts.js"></script>
</body>
</html>
