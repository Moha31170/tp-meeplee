<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeple — Connexion</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>Meeple</h1>
    <nav aria-label="Navigation principale"></nav>
  </header>
  <main>
    <h2>Connexion</h2>
    <p id="message" role="status"></p>
    <form id="form-connexion">
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
      </div>
      <div>
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p id="message-erreur" role="alert"></p>
      <button id="btn-login" type="submit">Se connecter</button>
      <p>Pas encore de compte ? <a id="lien-inscription" href="/inscription.html">Créer un compte</a></p>
    </form>
  </main>
  <footer></footer>
  <script type="module" src="/js/session.js"></script>
  <script type="module" src="/js/pages/connexion.js"></script>
</body>
</html>
